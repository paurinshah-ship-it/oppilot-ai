<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font:16px system-ui;color:#352d4b;margin:0}section{border:1px solid #d9d0eb;border-radius:12px;padding:16px;background:#faf8ff}button{min-height:44px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;margin:4px;background:#7563b5;color:white}button:disabled{opacity:.45;cursor:default}p{margin:9px 0;line-height:1.5}small{color:#655f76}#status{font-weight:600}label{display:block;margin-top:10px}button:focus-visible,input:focus-visible{outline:3px solid #443260;outline-offset:3px}#clear{background:#eee8f6;color:#443260}#status{padding:12px;background:#eee8f6;border-radius:8px}small{font-size:14px;line-height:1.6}</style></head><body>
<section><strong>Continuous voice · local processing</strong>
<p><button id="start" disabled>Start voice</button><button id="stop" disabled>Stop voice</button><button id="interrupt" disabled>Interrupt answer</button><button id="clear">Clear chat</button></p>
<p id="status" role="status" aria-live="polite">Initializing…</p>
<small>Speak, pause, and hear the answer. Speak again to interrupt. Use headphones to avoid speaker echo. English only. No PHI.</small>
<label>Microphone sensitivity <input id="sensitivity" type="range" min="5" max="60" value="18" aria-label="Microphone sensitivity threshold"></label>
<p id="transcript"></p><p id="answer"></p></section>
<script src="voice.js"></script></body></html>
